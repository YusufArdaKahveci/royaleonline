<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoyaleOnline - Mağaza</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Arka Plan */
        .hero-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(11, 12, 16, 0.4), rgba(11, 12, 16, 0.95)), 
                        url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=1920') no-repeat center center/cover;
            z-index: -1;
        }

        /* Header / Üst Menü */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            color: white;
        }

        .logo-container img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            list-style: none;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 6px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ip-box {
            background: #ff4757;
            color: #fff;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .user-btn {
            background: #3742fa;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        /* Mağaza İçerik Alanı */
        .store-container {
            max-width: 1200px;
            margin: 120px auto 50px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .store-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .store-subtitle {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff4757;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .store-title {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
        }

        .categories-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ddd;
        }

        .categories-title i {
            color: #ff4757;
        }

        /* Kategori Kartları Grid */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: rgba(18, 19, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 71, 87, 0.4);
            box-shadow: 0 12px 30px rgba(255, 71, 87, 0.2);
        }

        .card-img-wrapper {
            position: relative;
            height: 160px;
            background: #1a1b24;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: 0.3s;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.05);
            opacity: 1;
        }

        .card-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #ff4757;
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .card-footer {
            padding: 15px;
            text-align: center;
            background: rgba(15, 15, 20, 0.95);
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .grid-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .grid-cards {
                grid-template-columns: 1fr;
            }
        }

        /* Toast Bildirim */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2ed573;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="hero-background"></div>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo-container">
            <img src="logo.png" alt="RoyaleOnline Logo">
            <span>Royale<span style="color: #ffd32a;">Online</span></span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Anasayfa</a></li>
            <li><a href="magaza.html" class="active"><i class="fa-solid fa-cart-shopping"></i> Mağaza</a></li>
            <li><a href="#"><i class="fa-solid fa-wallet"></i> Kredi Yükle</a></li>
            <li><a href="#"><i class="fa-solid fa-headset"></i> Destek</a></li>
            <li><a href="#"><i class="fa-solid fa-book"></i> Wiki</a></li>
        </ul>
        <div class="nav-right">
            <div class="ip-box" onclick="copyIP()">
                <i class="fa-solid fa-signal"></i>
                <span>PLAY.ROYALEONLINE.COM</span>
            </div>
            <button class="user-btn"><i class="fa-solid fa-user"></i></button>
        </div>
    </header>

    <!-- Mağaza Ana İçerik -->
    <div class="store-container">
        <div class="store-header">
            <div class="store-subtitle">MAĞAZA</div>
            <h1 class="store-title">RoyaleOnline Mağazası</h1>
        </div>

        <div class="categories-title">
            <i class="fa-solid fa-cube"></i> KATEGORİLER
        </div>

        <div class="grid-cards">
            <!-- Kart 1 -->
            <a href="#" class="card">
                <div class="card-img-wrapper">
                    <span class="card-badge" style="background: #2ed573;">YENİ SEZON!</span>
                    <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=600" alt="Survival">
                </div>
                <div class="card-footer">SURVIVAL</div>
            </a>

            <!-- Kart 2 -->
            <a href="#" class="card">
                <div class="card-img-wrapper">
                    <span class="card-badge" style="background: #ffa502;">POPÜLER!</span>
                    <img src="https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=600" alt="SMP">
                </div>
                <div class="card-footer">SMP</div>
            </a>

            <!-- Kart 3 -->
            <a href="#" class="card">
                <div class="card-img-wrapper">
                    <span class="card-badge" style="background: #3742fa;">EN AKTİF MOD!</span>
                    <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600" alt="TOWNY">
                </div>
                <div class="card-footer">TOWNY</div>
            </a>

            <!-- Kart 4 -->
            <a href="#" class="card">
                <div class="card-img-wrapper">
                    <span class="card-badge">YENİ SEZON BAŞLADI!</span>
                    <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=600" alt="TEKBLOCK">
                </div>
                <div class="card-footer">TEKBLOCK</div>
            </a>

            <!-- Kart 5 -->
            <a href="#" class="card">
                <div class="card-img-wrapper">
                    <span class="card-badge">YENİ SEZON BAŞLADI!</span>
                    <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=600" alt="SKYBLOCK">
                </div>
                <div class="card-footer">SKYBLOCK</div>
            </a>

            <!-- Kart 6 -->
            <a href="#" class="card">
                <div class="card-img-wrapper">
                    <span class="card-badge" style="background: #7158e2;">BOXPVP</span>
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600" alt="BOXPVP">
                </div>
                <div class="card-footer">BOXPVP</div>
            </a>
        </div>
    </div>

    <div class="toast" id="toast">IP Adresi Kopyalandı!</div>

    <script>
        function copyIP() {
            navigator.clipboard.writeText("PLAY.ROYALEONLINE.COM");
            const toast = document.getElementById("toast");
            toast.style.display = "block";
            setTimeout(() => {
                toast.style.display = "none";
            }, 2000);
        }
    </script>
</body>
</html>
